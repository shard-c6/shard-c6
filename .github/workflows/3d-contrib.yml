name: GitHub Profile 3D Contrib

on:
  schedule:
    # Runs daily at 18:30 UTC (midnight IST)
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shard-c6

      - name: Commit & Push
        run: |
          git config user.name "shard-c6"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "chore: update 3d contribution calendar"; then
            git pull --rebase origin main
            git push
          fi
