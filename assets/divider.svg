<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 8" width="800" height="8">
  <defs>
    <linearGradient id="divider-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#39FF14;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:0" />
    </linearGradient>
  </defs>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .divider-line {
      animation: pulse 3s ease-in-out infinite;
    }
    .glow-line {
      animation: pulse 3s ease-in-out infinite;
      animation-delay: 0.5s;
    }
  </style>
  <rect x="0" y="0" width="800" height="8" rx="4" fill="url(#glow)" class="glow-line" />
  <rect x="0" y="2" width="800" height="4" rx="2" fill="url(#divider-gradient)" class="divider-line" />
</svg>
