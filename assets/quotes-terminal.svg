<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <style>
    .bg { fill: #1E1E1E; }
    .header-bg { fill: #2D2D2D; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: #A0A0A0;
      font-weight: 500;
    }
    .prompt {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #00d9ff;
      font-weight: bold;
    }
    .quote-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #39FF14;
      font-weight: bold;
      opacity: 0;
      animation: type 0.1s forwards;
    }
    .author-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #ff6b6b;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
      animation: type 0.1s forwards;
    }
    .cursor {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #39FF14;
    }

    @keyframes type {
      to { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .blink-cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Terminal Window -->
  <rect width="100%" height="100%" rx="10" class="bg" />

  <!-- MacBook Header -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 30 L 0 30 Z" class="header-bg" />

  <!-- Window Buttons -->
  <circle cx="20" cy="15" r="6" fill="#FF5F56" />
  <circle cx="40" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="15" r="6" fill="#27C93F" />

  <!-- Title -->
  <text x="50%" y="20" text-anchor="middle" class="title">quotes@shard-c6:~</text>

  <!-- Prompt -->
  <text x="20" y="60" class="prompt">$ fortune | cowthink</text>
  <text x="20" y="90" class="quote-text" style="animation-delay: 0.5s">"Don't comment bad code - rewrite it."</text>
  <text x="20" y="120" class="author-text" style="animation-delay: 0.7s">— Brian Kernighan</text>

  <!-- Prompt 2 -->
  <text x="20" y="160" class="prompt" style="opacity: 0; animation: type 0.1s 1.2s forwards">$ <tspan class="blink-cursor">▊</tspan></text>
</svg>
