<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <style>
    .bg { fill: #1E1E1E; }
    .header-bg { fill: #2D2D2D; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: #A0A0A0;
      font-weight: 500;
    }
    .prompt {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #00d9ff;
      font-weight: bold;
    }
    .quote-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #39FF14;
      font-weight: bold;
      opacity: 0;
    }
    .author-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #ff6b6b;
      font-weight: normal;
      font-style: italic;
      opacity: 0;
    }
    .cursor {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      fill: #39FF14;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-5px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Quote 1 cycle: visible 0-8s */
    .q1 { animation: fadeIn 0.3s 0.5s forwards; }
    .q1a { animation: fadeIn 0.3s 1.2s forwards; }

    /* Quote 2 cycle: visible 8-16s */
    .q2 { animation: fadeIn 0.3s 8.5s forwards; }
    .q2a { animation: fadeIn 0.3s 9.2s forwards; }

    /* Quote 3 cycle: visible 16-24s */
    .q3 { animation: fadeIn 0.3s 16.5s forwards; }
    .q3a { animation: fadeIn 0.3s 17.2s forwards; }

    .blink-cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Terminal Window -->
  <rect width="100%" height="100%" rx="10" class="bg" />

  <!-- MacBook Header -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 790 0 C 795.523 0 800 4.477 800 10 L 800 30 L 0 30 Z" class="header-bg" />

  <!-- Window Buttons -->
  <circle cx="20" cy="15" r="6" fill="#FF5F56" />
  <circle cx="40" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="15" r="6" fill="#27C93F" />

  <!-- Title -->
  <text x="50%" y="20" text-anchor="middle" class="title">quotes@shard-c6:~</text>

  <!-- Prompt -->
  <text x="20" y="60" class="prompt">$ fortune | cowthink</text>

  <!-- Quote 1 -->
  <text x="20" y="90" class="quote-text q1">"Data is the new oil, but only if you know how</text>
  <text x="20" y="110" class="quote-text q1"> to refine it."</text>
  <text x="20" y="140" class="author-text q1a">— Clive Humby</text>

  <!-- Quote 2 (appears after first disappears) -->
  <text x="20" y="90" class="quote-text q2">"The goal is to turn data into information, and</text>
  <text x="20" y="110" class="quote-text q2"> information into insight."</text>
  <text x="20" y="140" class="author-text q2a">— Carly Fiorina</text>

  <!-- Quote 3 -->
  <text x="20" y="90" class="quote-text q3">"Without big data analytics, companies are</text>
  <text x="20" y="110" class="quote-text q3"> blind and deaf, wandering onto the web</text>
  <text x="20" y="130" class="quote-text q3"> like deer on a freeway."</text>
  <text x="20" y="160" class="author-text q3a">— Geoffrey Moore</text>

  <!-- Prompt 2 -->
  <text x="20" y="190" class="prompt">$ <tspan class="blink-cursor">▊</tspan></text>
</svg>
