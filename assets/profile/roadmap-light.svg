</g>
<g class="rise" style="animation-delay:0.96s">
<text x="698" y="66" text-anchor="middle" class="mono acc" font-size="15" letter-spacing="1.5">NOW</text>
<circle cx="698" cy="96" r="8" class="nofill s-acc" stroke-width="2"><animate attributeName="r" values="8;22" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="698" cy="96" r="9" class="acc"/><circle cx="698" cy="96" r="3.5" class="bg"/>
<text x="698" y="142" text-anchor="middle" class="sans ink" font-size="19" font-weight="600">MOSIP Decode</text>
<text x="698" y="170" text-anchor="middle" class="sans muted" font-size="16">Conformance automation</text>
</g>
