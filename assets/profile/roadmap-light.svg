</g>
<g class="rise" style="animation-delay:0.52s">
<text x="306" y="66" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.5">2025</text>
<circle cx="306" cy="96" r="8" class="acc"/>
<text x="306" y="142" text-anchor="middle" class="sans ink" font-size="19" font-weight="600">Open source</text>
<text x="306" y="170" text-anchor="middle" class="sans muted" font-size="16">opensre · GreenGuard</text>
</g>
<g class="rise" style="animation-delay:0.74s">
<text x="502" y="66" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.5">2026</text>
<circle cx="502" cy="96" r="8" class="acc"/>
