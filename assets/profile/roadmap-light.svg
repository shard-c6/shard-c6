<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="196" viewBox="0 0 1200 196" role="img" aria-label="Roadmap: B.Tech at VIT Mumbai 2024, open source 2025, hackathons 2026, MOSIP Decode now, GSoC 2027, goal ML / Data Engineer">
<title>Roadmap: B.Tech at VIT Mumbai 2024, open source 2025, hackathons 2026, MOSIP Decode now, GSoC 2027, goal ML / Data Engineer</title>
<style>
svg{--ink:#1f2328;--muted:#59636e;--faint:#818b98;--line:#d1d9e0;--panel:#f6f8fa;--bg:#ffffff;--warn:#9a6700;--acc:#bc4c00}
.ink{fill:var(--ink)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.acc{fill:var(--acc)}.warn{fill:var(--warn)}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.nofill{fill:none}
.s-line{stroke:var(--line)}.s-acc{stroke:var(--acc)}.s-faint{stroke:var(--faint)}.s-warn{stroke:var(--warn)}.s-ink{stroke:var(--ink)}.s-bg{stroke:var(--bg)}
.sans{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:588;stroke-dashoffset:588;animation:draw 1.8s cubic-bezier(.6,0,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.motion{display:none}}
</style>
<line x1="698" y1="96" x2="1090" y2="96" class="s-faint" stroke-width="2" stroke-dasharray="3 7"/>
<line x1="110" y1="96" x2="698" y2="96" class="s-line" stroke-width="2"/>
<line x1="110" y1="96" x2="698" y2="96" class="s-acc draw" stroke-width="3" stroke-linecap="round"/>
<g class="rise" style="animation-delay:0.30s">
<text x="110" y="66" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="1.5">2024</text>
