<text x="1090" y="142" text-anchor="middle" class="sans muted" font-size="19" font-weight="600">ML / Data Engineer</text>
<text x="1090" y="170" text-anchor="middle" class="sans faint" font-size="16">systems, end to end</text>
</g>
</svg>
