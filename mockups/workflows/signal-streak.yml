# Copy to .github/workflows/ once a streak design is chosen.
# Regenerates the streak SVGs daily from the contribution calendar.
name: Signal streak

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 mockups/signal_options.py --streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mockups/b-signal/assets/streak-*.svg
          git diff --cached --quiet || git commit -m "chore: update streak"
          git push
