<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Shardul Chogale — ML and data engineer building systems end to end">
<title>Shardul Chogale — ML and data engineer building systems end to end</title>
<style>
svg{--ink:#f0f6fc;--muted:#9198a1;--faint:#656c76;--line:#3d444d;--panel:#151b23;--bg:#0d1117;--warn:#d29922;--acc:#4493f8}
.ink{fill:var(--ink)}.muted{fill:var(--muted)}.faint{fill:var(--faint)}.acc{fill:var(--acc)}.warn{fill:var(--warn)}
.bg{fill:var(--bg)}.panel{fill:var(--panel)}.nofill{fill:none}
.s-line{stroke:var(--line)}.s-acc{stroke:var(--acc)}.s-faint{stroke:var(--faint)}.s-warn{stroke:var(--warn)}.s-ink{stroke:var(--ink)}.s-bg{stroke:var(--bg)}
