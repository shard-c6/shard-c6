<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile mockups</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--link:#0969da}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f6fc;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--link:#4493f8}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
nav{position:sticky;top:0;display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:1}
nav button{font:inherit;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
nav button[aria-pressed=true]{border-color:var(--link);color:var(--link)}
main{max-width:830px;margin:24px auto;padding:24px;border:1px solid var(--line);border-radius:6px}
a{color:var(--link);text-decoration:none} h3{border-bottom:1px solid var(--line);padding-bottom:.3em;margin-top:1.6em}
table{border-collapse:collapse;width:100%} td,th{border:1px solid var(--line);padding:6px 13px;vertical-align:top}
code{background:var(--panel);padding:.2em .4em;border-radius:6px;font-size:85%} pre{background:var(--panel);padding:16px;border-radius:6px;overflow:auto} pre code{padding:0}
img{max-width:100%}
@media (max-width:700px){main{margin:12px;padding:16px}}
</style>
<nav>
  <button data-v="a-pipeline">A · Pipeline</button>
  <button data-v="b-signal">B · Signal</button>
  <button data-v="c-terminal">C · Terminal</button>
  <button data-v="b-signal" data-f="OPTIONS.md">B · options</button>
</nav>
<main id="out"></main>
<script>
const out = document.getElementById('out');
async function show(v, f='README.md'){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===v && (b.dataset.f||'README.md')===f));
  const md = await (await fetch(v + '/' + f, {cache:'no-store'})).text();
  out.innerHTML = marked.parse(md.replace(/\.\/assets\//g, v + "/assets/"));
  location.hash = v + (f==='README.md' ? '' : ':' + f);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v, b.dataset.f));
const [hv, hf] = location.hash.slice(1).split(':'); show(hv || 'a-pipeline', hf || 'README.md');
</script>
