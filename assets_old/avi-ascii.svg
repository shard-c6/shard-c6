  <circle cx="40" cy="15" r="6" fill="#FFBD2E" />
  <circle cx="60" cy="15" r="6" fill="#27C93F" />
  
  <!-- Title -->
  <text x="50%" y="20" text-anchor="middle" class="title">shard-c6@macbook:~</text>
  
  <!-- Command prompt before typing avatar -->
