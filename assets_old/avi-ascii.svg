  <!-- Terminal Window -->
  <rect width="100%" height="100%" rx="10" class="terminal-bg" />
  
  <!-- MacBook Header -->
  <path d="M 0 10 C 0 4.477 4.477 0 10 0 L 472.0 0 C 462.0 0 472.0 4.477 472.0 10 L 472.0 30 L 0 30 Z" class="header-bg" />
  
  <!-- Window Buttons -->
